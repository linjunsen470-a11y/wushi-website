name: Deploy Next.js Standalone to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint project
        run: pnpm lint

      - name: Build project
        run: pnpm build

      - name: Prepare deployment package
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_TO_EMAIL: ${{ secrets.LEAD_TO_EMAIL }}
          LEAD_FROM_EMAIL: ${{ secrets.LEAD_FROM_EMAIL }}
        run: |
          set -euo pipefail

          # Next.js standalone output does not include public or static assets.
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/

          node <<'NODE'
          const fs = require('node:fs');
          let config = fs.readFileSync('ecosystem.config.js', 'utf8');
          for (const key of ['RESEND_API_KEY', 'LEAD_TO_EMAIL', 'LEAD_FROM_EMAIL']) {
            config = config.replace(`'TOKEN_${key}'`, () => JSON.stringify(process.env[key] || ''));
          }
          // Restrict access before writing any secret values.
          fs.chmodSync('ecosystem.config.js', 0o600);
          fs.writeFileSync('ecosystem.config.js', config);
          NODE

          # scp-action's container runs as UID 1000; keep the file private.
          sudo chown 1000:1000 ecosystem.config.js
          test "$(stat -c '%u:%g:%a' ecosystem.config.js)" = '1000:1000:600'

          tar -czf release.tar.gz -C .next/standalone .

      - name: Prepare private transfer directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            # SCP temporarily stores an archive containing the private config.
            install -d -m 700 "${{ secrets.REMOTE_TARGET }}/.transfer"
            test "$(stat -c '%a' "${{ secrets.REMOTE_TARGET }}/.transfer")" = '700'

      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "release.tar.gz,ecosystem.config.js,docs/nginx-redirect.conf"
          target: ${{ secrets.REMOTE_TARGET }}
          tar_tmp_path: ${{ secrets.REMOTE_TARGET }}/.transfer/

      - name: Deploy and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            # Ensure the target directory exists (for "nuke and rebuild" support)
            mkdir -p ${{ secrets.REMOTE_TARGET }}
            cd ${{ secrets.REMOTE_TARGET }}
            # Verify privacy immediately after extraction, before any restart.
            test "$(stat -c '%a' ecosystem.config.js)" = '600'
            echo "Verified uploaded config permissions: 600"

            DEPLOY_ID="${{ github.run_id }}-${{ github.run_attempt }}"
            DEPLOY_DIR="releases/$DEPLOY_ID"
            mkdir -p "$DEPLOY_DIR"

            tar -xzf release.tar.gz -C "$DEPLOY_DIR"
            rm release.tar.gz

            if [ -f ".env.local" ]; then
              cp .env.local "$DEPLOY_DIR/"
            fi

            echo "Deployed release: $DEPLOY_ID"

            # ================== Nginx configuration deployment ==================
            echo "Checking and updating Nginx configuration..."
            NGINX_CONF_DEST="/etc/nginx/sites-available/wushi-website.conf"
            NGINX_ENABLED_LINK="/etc/nginx/sites-enabled/wushi-website.conf"
            OLD_NGINX_LINK="/etc/nginx/sites-enabled/wushi-website"

            # Remove old duplicate site configuration link if present to avoid conflict
            if [ -L "$OLD_NGINX_LINK" ] || [ -f "$OLD_NGINX_LINK" ]; then
              echo "Removing old duplicate Nginx configuration link: $OLD_NGINX_LINK"
              sudo rm -f "$OLD_NGINX_LINK"
            fi

            if [ -f "docs/nginx-redirect.conf" ]; then
              sudo cp docs/nginx-redirect.conf "$NGINX_CONF_DEST"
              if [ ! -L "$NGINX_ENABLED_LINK" ]; then
                sudo ln -s "$NGINX_CONF_DEST" "$NGINX_ENABLED_LINK"
              fi
              
              if sudo nginx -t; then
                echo "Nginx configuration test passed, reloading Nginx service..."
                sudo systemctl reload nginx
                echo "Nginx reload completed successfully."
                
                # Remove diagnostic file if present for security
                if [ -f "current/public/nginx-diagnostic.txt" ]; then
                  rm -f "current/public/nginx-diagnostic.txt"
                fi
              else
                echo "Error: Nginx configuration test failed!"
                exit 1
              fi
              rm -rf docs
            else
              echo "Warning: docs/nginx-redirect.conf not found."
            fi
            # ====================================================================

            ln -sfn "$DEPLOY_DIR" current

            if pm2 describe wushi-website > /dev/null 2>&1; then
              echo "Reloading existing PM2 process..."
              pm2 reload ecosystem.config.js --update-env
            else
              echo "Starting new PM2 process..."
              pm2 start ecosystem.config.js
            fi

            # A failed local HTTP check stops cleanup and search-engine submission.
            curl --fail --silent --show-error --retry 6 --retry-connrefused --retry-delay 2 --max-time 10 http://127.0.0.1:3000/ > /dev/null

            find releases -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
              | sort -rn \
              | tail -n +6 \
              | cut -d' ' -f2- \
              | xargs -r rm -rf --

      - name: Submit deployed URLs to search engines
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: pnpm seo:submit
