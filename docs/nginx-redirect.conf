# ==============================================================================
# Nginx Redirection configuration for cqwushi.com
# Put this file in /etc/nginx/sites-available/ or merge into your default config.
# ==============================================================================

# 1. Redirect HTTP (Port 80) to HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name cqwushi.com www.cqwushi.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.cqwushi.com$request_uri;
    }
}

# HAProxy owns public TCP 443; this listener receives its PROXY header.
# 2. Redirect HTTPS cqwushi.com (non-www) to HTTPS www.cqwushi.com
server {
    listen 127.0.0.1:8443 ssl http2 proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name cqwushi.com;

    # SSL Settings (Configure with your own SSL certificate paths)
    ssl_certificate /etc/letsencrypt/live/cqwushi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cqwushi.com/privkey.pem;
    
    # Secure SSL Protocols and Ciphers (Recommended)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        return 301 https://www.cqwushi.com$request_uri;
    }
}

# 3. Main server block for HTTPS www.cqwushi.com
server {
    listen 127.0.0.1:8443 ssl http2 proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name www.cqwushi.com;

    # SSL Settings (Configure with your own SSL certificate paths)
    ssl_certificate /etc/letsencrypt/live/cqwushi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cqwushi.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip settings for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Reverse Proxy to Next.js Application running on PM2 (Port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
